<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" font-family="ui-monospace, 'Cascadia Code', 'Courier New', monospace" role="img" aria-label="Terminal: Krish Goel, offensive security in training. Find the flaw. Understand the why. Make the system stronger.">
  <defs>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2ff3ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#2ff3ff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#2ff3ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- window -->
  <rect x="1" y="1" width="898" height="258" fill="#07060a" stroke="#2c2730" stroke-width="1.5"/>

  <!-- decorative scan line (pure flourish; harmless if static) -->
  <rect x="1.5" y="38" width="897" height="46" fill="url(#scan)" opacity="0.9">
    <animate attributeName="y" values="38;214;38" dur="6s" repeatCount="indefinite" calcMode="linear"/>
  </rect>

  <!-- title bar -->
  <rect x="1.5" y="1.5" width="897" height="35" fill="#110e14"/>
  <line x1="1.5" y1="37" x2="898.5" y2="37" stroke="#2c2730" stroke-width="1"/>
  <circle cx="26" cy="19" r="5" fill="#ff2340"/>
  <circle cx="46" cy="19" r="5" fill="#2c2730"/>
  <circle cx="66" cy="19" r="5" fill="#2c2730"/>
  <text x="450" y="23" text-anchor="middle" fill="#8d858f" font-size="13">krish@krishgoel: ~</text>
  <text x="878" y="23" text-anchor="end" fill="#4a444e" font-size="12">bash</text>

  <!-- content (fully visible at rest) -->
  <g font-size="17">
    <text x="36" y="86"><tspan fill="#2ff3ff">$</tspan><tspan fill="#efe9df"> whoami</tspan></text>
    <text x="36" y="124"><tspan fill="#efe9df" font-weight="700">Krish Goel</tspan><tspan fill="#8d858f"> — </tspan><tspan fill="#2ff3ff">offensive security, in training</tspan></text>
    <text x="36" y="170"><tspan fill="#2ff3ff">$</tspan><tspan fill="#efe9df"> cat ~/.mission</tspan></text>
    <text x="36" y="208"><tspan fill="#efe9df">Find the flaw. Understand the why. Make the system </tspan><tspan fill="#ff2340" font-weight="700">stronger.</tspan><tspan fill="#ff2340" font-weight="700"> █<animate attributeName="fill-opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite" calcMode="discrete"/></tspan></text>
  </g>

  <!-- bottom accent -->
  <rect x="1" y="256" width="898" height="3" fill="#ff2340"/>
</svg>
